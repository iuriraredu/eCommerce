name: CI - Unit Tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java (ajuste a versão se estiver usando a 17 ou 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # 3. Dá permissão de execução ao mvnw (caso use Maven Wrapper) ou roda direto via maven
      - name: Run Unit Tests with Maven
        run: mvn clean test