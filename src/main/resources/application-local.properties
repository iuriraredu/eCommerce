# Local development profile: H2 file-based database, console enabled, verbose SQL logging.
# Active by default (see application.properties) — this is what runs when you just hit "Run"
# in the IDE without configuring anything.

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Opção 1: Em memória (recomendo para desenvolvimento)
#spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1

# Opção 2: Em arquivo com parâmetros de fechamento (se precisar persistir)
spring.datasource.url=jdbc:h2:file:./data/ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Fine for local study/experimentation: the schema is thrown away and recreated on every
# restart. Never acceptable outside this profile — see application-prod.properties.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Local-only fallback so the app runs without configuring any environment variable.
# Override with your own value via API_SECURITY_TOKEN_SECRET if you want; never reuse this
# value anywhere outside your machine.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:dev-only-secret-troque-antes-de-usar-em-producao}
