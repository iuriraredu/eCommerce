# Production profile: real database, no dev conveniences. Every sensitive value below is
# required from the environment — no defaults — so a missing configuration fails the
# application at startup instead of silently running with the wrong (or a dangerous) setting.

# H2 Console must never be reachable outside local development — it's an unauthenticated raw
# SQL client exposed over HTTP. Explicitly disabled here, independent of what SecurityConfigurations
# permits, so a missed profile switch alone can't accidentally expose it: this is a second,
# independent layer of defense on top of the security filter chain.
spring.h2.console.enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# validate, never update/create-drop: schema changes in production belong to a migration tool
# (Flyway/Liquibase), not to Hibernate improvising DDL against a real database. This project
# doesn't have migrations set up yet (see project roadmap) — add Flyway/Liquibase and a proper
# baseline migration BEFORE actually deploying with this profile, or startup will fail here
# with a validation error against an empty schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# api.security.token.secret: intentionally NOT redeclared here. It falls through to the
# no-default version in application.properties (${API_SECURITY_TOKEN_SECRET}), so this
# profile fails to start if the environment variable isn't set — exactly what we want in prod.
