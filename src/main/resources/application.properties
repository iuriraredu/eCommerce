spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Opção 1: Em memória (recomendo para desenvolvimento)
#spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1

# Opção 2: Em arquivo com parâmetros de fechamento (se precisar persistir)
spring.datasource.url=jdbc:h2:file:./data/ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

api.security.token.secret=${API_SECURITY_TOKEN_SECRET:dev-only-secret}