spring.application.name=ecommerce

# Active profile: defaults to "local" so the project runs out of the box for day-to-day
# development. Real environments override this explicitly, e.g.:
#   export SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.properties.hibernate.format_sql=true

# No default value here on purpose: whether this is required or has a fallback is a
# per-environment decision, made in each profile's own file below.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
